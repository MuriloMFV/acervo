<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Quick micro-interaction for filter chips
    const chipButtons = document.querySelectorAll('button[type="button"]:not([role="switch"])');
    chipButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        // tactile button pulse
        btn.style.transform = 'scale(0.96)';
        setTimeout(() => {
          btn.style.transform = '';
        }, 120);
      });
    });

    // Toggle switch interaction
    const switchButtons = document.querySelectorAll('button[role="switch"]');
    switchButtons.forEach(toggle => {
      toggle.addEventListener('click', () => {
        const isChecked = toggle.getAttribute('aria-checked') === 'true';
        const thumb = toggle.querySelector('span');
        
        if (isChecked) {
          toggle.setAttribute('aria-checked', 'false');
          toggle.classList.remove('bg-primary');
          toggle.classList.add('bg-surface-variant');
          thumb.classList.remove('translate-x-6', 'bg-on-primary');
          thumb.classList.add('translate-x-0', 'bg-outline');
        } else {
          toggle.setAttribute('aria-checked', 'true');
          toggle.classList.remove('bg-surface-variant');
          toggle.classList.add('bg-primary');
          thumb.classList.remove('translate-x-0', 'bg-outline');
          thumb.classList.add('translate-x-6', 'bg-on-primary');
        }
      });
    });
  });
